<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仕入れ店舗リスト</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root{
    --accent:#0F766E;       /* teal */
    --accent-dark:#0B5750;
    --bg:#F4F4F6;
    --card:#fff;
    --line:#e5e7eb;
    --text:#333;
    --muted:#888;
    --warn:#EA580C;         /* orange for しばらく未訪問 */
    --warn-bg:#FFF7ED;
  }
  body{
    font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
    background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%;
  }
  header{
    background:var(--accent); color:#fff; padding:14px 16px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    position:sticky; top:0; z-index:5;
  }
  header .ttl{ font-size:17px; font-weight:bold; }
  header button{
    background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.5);
    border-radius:6px; padding:6px 10px; font-size:13px; cursor:pointer;
  }
  header button:active{ background:rgba(255,255,255,.3); }
  .wrap{ max-width:720px; margin:0 auto; padding:12px; }
  .card{
    background:var(--card); border-radius:10px; padding:14px;
    box-shadow:0 1px 4px rgba(0,0,0,.07); margin-bottom:12px;
  }
  .sec-ttl{ font-size:13px; font-weight:bold; color:var(--accent); margin-bottom:10px; }

  /* ---- summary ---- */
  .period-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .chip{
    border:1px solid var(--line); background:#fff; color:#555;
    border-radius:999px; padding:5px 12px; font-size:12px; cursor:pointer; white-space:nowrap;
  }
  .chip.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .ratio-bar{ display:flex; height:26px; border-radius:6px; overflow:hidden; margin:6px 0 10px; background:#eee; }
  .ratio-bar .seg-store{ background:var(--accent); }
  .ratio-bar .seg-net{ background:#94A3B8; }
  .ratio-bar span{ color:#fff; font-size:11px; line-height:26px; text-align:center; overflow:hidden; }
  .ratio-legend{ display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:#555; }
  .ratio-legend .dot{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:middle; }

  /* ---- controls ---- */
  .ctrl-label{ font-size:11px; color:var(--muted); margin:0 0 5px; }
  .sort-row{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .toggle-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:13px; }
  .toggle-row input{ width:18px; height:18px; accent-color:var(--accent); }
  #search{
    width:100%; padding:9px 12px; font-size:14px; border:1px solid var(--line);
    border-radius:8px; outline:none;
  }
  #search:focus{ border-color:var(--accent); }

  /* ---- store list ---- */
  .list-meta{ font-size:12px; color:var(--muted); margin:4px 2px 8px; }
  .store{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:10px;
  }
  .store.stale{ border-color:var(--warn); background:var(--warn-bg); }
  .store-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .store-name{ font-size:15px; font-weight:bold; line-height:1.4; word-break:break-word; }
  .badge{ display:inline-block; font-size:10px; padding:1px 7px; border-radius:999px; margin-left:6px; vertical-align:middle; font-weight:normal; }
  .badge.stale{ background:var(--warn); color:#fff; }
  .badge.once{ background:#E0E7FF; color:#3730A3; }
  .badge.infer{ background:#F1F5F9; color:#64748B; }
  .map-btn{
    flex:0 0 auto; text-decoration:none; background:var(--accent); color:#fff;
    font-size:12px; padding:7px 11px; border-radius:8px; white-space:nowrap;
  }
  .map-btn:active{ background:var(--accent-dark); }
  .store-last{ font-size:13px; margin-top:8px; color:#444; }
  .store-last .days{ font-weight:bold; color:#222; }
  .store-last .days.warn{ color:var(--warn); }
  .store-stats{ font-size:12px; color:#666; margin-top:5px; }
  .store-stats b{ color:#222; font-weight:bold; }

  /* ---- settings ---- */
  details.settings summary{ cursor:pointer; font-size:13px; font-weight:bold; color:var(--accent); list-style:none; }
  details.settings summary::-webkit-details-marker{ display:none; }
  details.settings summary::before{ content:"⚙️ "; }
  .set-block{ margin-top:14px; }
  .set-block .ctrl-label{ margin-bottom:8px; }
  .kw-list{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .kw{ background:#F1F5F9; border-radius:999px; padding:4px 10px; font-size:12px; display:flex; align-items:center; gap:6px; }
  .kw button{ background:none; border:none; color:#94A3B8; cursor:pointer; font-size:14px; line-height:1; padding:0; }
  .kw-add{ display:flex; gap:6px; }
  .kw-add input{ flex:1; padding:7px 10px; font-size:13px; border:1px solid var(--line); border-radius:8px; }
  .kw-add button, .num-row button{ background:var(--accent); color:#fff; border:none; border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; }
  .num-row{ display:flex; align-items:center; gap:8px; }
  .num-row input{ width:80px; padding:7px 10px; font-size:13px; border:1px solid var(--line); border-radius:8px; }

  .empty{ text-align:center; color:var(--muted); font-size:14px; padding:30px 10px; }
  .loading{ text-align:center; color:var(--muted); font-size:14px; padding:40px 10px; }
  .err{ color:#DC2626; font-size:13px; text-align:center; padding:20px; }
</style>
</head>
<body>
<header>
  <span class="ttl">🏬 仕入れ店舗リスト</span>
  <button onclick="reload()">🔄 更新</button>
</header>

<div class="wrap">
  <div id="root"><div class="loading">読み込み中…</div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
// ==================== Firebase（inv-app と同一・読み取り専用） ====================
const FB_CFG = {
  apiKey:"AIzaSyDCK9lsBJsc-UxzxcfxMPdJS94V1gZb2k8",
  authDomain:"hs-tools-86dab.firebaseapp.com",
  projectId:"hs-tools-86dab",
  storageBucket:"hs-tools-86dab.firebasestorage.app",
  messagingSenderId:"755265926130",
  appId:"1:755265926130:web:257584deb277fc7ce3716b"
};
let _db = null;

// ==================== 設定（localStorage） ====================
const SETTINGS_KEY = 'shiire_settings';
const DEFAULT_ONLINE_KW = ['メルカリ','ゾゾタウン','ZOZO','ベクトルパーク','ベクトル','ラクマ','ヤフオク','ヤフーフリマ','楽天','Amazon','アマゾン','オンライン','おたからや','ジモティ'];
const DEFAULT_THRESHOLD = 60;

function getSettings(){
  try{
    const s = JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}');
    return {
      onlineKeywords: Array.isArray(s.onlineKeywords) ? s.onlineKeywords : DEFAULT_ONLINE_KW.slice(),
      threshold: Number.isFinite(s.threshold) ? s.threshold : DEFAULT_THRESHOLD
    };
  }catch(e){
    return { onlineKeywords: DEFAULT_ONLINE_KW.slice(), threshold: DEFAULT_THRESHOLD };
  }
}
function saveSettings(s){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); }

// ==================== 状態 ====================
let _items = [];          // {purchaseSource, purchaseDate, purchasePrice}
let _loaded = false;
let _loadError = '';
let state = {
  sort: 'lastAsc',        // lastAsc | itemDesc | nameAsc
  excludeOnce: false,
  search: '',
  period: 'all'           // 'all' | 'YYYY-MM'
};

// ==================== ユーティリティ ====================
function isOnline(name){
  const kws = getSettings().onlineKeywords;
  return kws.some(kw => kw && name.includes(kw));
}
function todayStr(){
  const n = new Date();
  const p = x => String(x).padStart(2,'0');
  return n.getFullYear()+'-'+p(n.getMonth()+1)+'-'+p(n.getDate());
}
function daysSince(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return null;
  const n = new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.floor((today - d)/86400000);
}
function _iso(y,mo,da){ const p=x=>String(x).padStart(2,'0'); return y+'-'+p(mo)+'-'+p(da); }
// 年なしM/Dは「今日基準で最も近い過去の年」に補完
function inferYear(mo, day){
  const n = new Date();
  const today = new Date(n.getFullYear(), n.getMonth(), n.getDate());
  const cand = new Date(n.getFullYear(), mo-1, day);
  return cand <= today ? n.getFullYear() : n.getFullYear()-1;
}
// 各種日付表記を {iso:'YYYY-MM-DD'|null, inferred:bool} に正規化
function normalizeDate(raw){
  const d=(raw||'').trim();
  if(!d) return {iso:null, inferred:false};
  let m;
  if(m=d.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/)) return {iso:_iso(+m[1],+m[2],+m[3]), inferred:false};
  if(m=d.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})$/)) return {iso:_iso(+m[1],+m[2],+m[3]), inferred:false};
  if(m=d.match(/^(\d{1,2})\/(\d{1,2})$/)){
    const mo=+m[1], da=+m[2];
    if(mo>=1&&mo<=12&&da>=1&&da<=31) return {iso:_iso(inferYear(mo,da),mo,da), inferred:true};
  }
  return {iso:null, inferred:false};
}
function yen(n){ return '¥'+(n||0).toLocaleString('ja-JP'); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ==================== 集計 ====================
// 店舗ごとに集計（purchaseSource 完全一致でグルーピング）
function aggregateStores(){
  const map = new Map();
  _items.forEach(it=>{
    const name = (it.purchaseSource||'').trim();
    if(!name) return;
    if(!map.has(name)) map.set(name, { name, itemCount:0, dates:new Set(), totalSpent:0, lastDate:null, lastInferred:false });
    const g = map.get(name);
    g.itemCount++;
    g.totalSpent += (Number(it.purchasePrice)||0);
    const iso = it._iso;            // 正規化済み（補完含む）
    if(iso){
      g.dates.add(iso);
      if(!g.lastDate || iso > g.lastDate){ g.lastDate = iso; g.lastInferred = it._inferred; }
    }
  });
  return [...map.values()].map(g=>({
    name: g.name,
    itemCount: g.itemCount,
    visitCount: g.dates.size,
    totalSpent: g.totalSpent,
    lastDate: g.lastDate,
    lastInferred: g.lastInferred,
    days: daysSince(g.lastDate),
    online: isOnline(g.name)
  }));
}

// 期間内の店舗:ネット比率（点数・金額）
function periodSummary(){
  const items = _items.filter(it=>{
    const name=(it.purchaseSource||'').trim();
    if(!name) return false;
    if(state.period==='all') return true;
    return (it._iso||'').startsWith(state.period);
  });
  const r = { store:{count:0,amt:0}, net:{count:0,amt:0} };
  items.forEach(it=>{
    const name=(it.purchaseSource||'').trim();
    const bucket = isOnline(name) ? r.net : r.store;
    bucket.count++;
    bucket.amt += (Number(it.purchasePrice)||0);
  });
  return r;
}

// 月リスト（YYYY-MM, 新しい順）
function monthOptions(){
  const set = new Set();
  _items.forEach(it=>{
    if(it._iso) set.add(it._iso.slice(0,7));
  });
  return [...set].sort((a,b)=>b.localeCompare(a));
}

// ==================== 描画 ====================
function render(){
  const root = document.getElementById('root');
  if(!_loaded){
    root.innerHTML = _loadError
      ? `<div class="err">読み込みに失敗しました。<br>${esc(_loadError)}<br><br>通信環境を確認して「🔄 更新」を押してください。</div>`
      : `<div class="loading">読み込み中…</div>`;
    return;
  }

  root.innerHTML = renderSummary() + renderControls() + renderList() + renderSettingsUI();
  const sb = document.getElementById('search');
  if(sb){ sb.value = state.search; }
}

function renderSummary(){
  const s = periodSummary();
  const total = s.store.count + s.net.count;
  const sp = total ? Math.round(s.store.count/total*100) : 0;
  const np = total ? 100-sp : 0;
  const months = monthOptions();
  const chips = [`<span class="chip${state.period==='all'?' active':''}" onclick="setPeriod('all')">全期間</span>`]
    .concat(months.map(m=>`<span class="chip${state.period===m?' active':''}" onclick="setPeriod('${m}')">${m.replace('-','/')}</span>`))
    .join('');

  let bar;
  if(total===0){
    bar = `<div class="ratio-bar"><span style="flex:1;color:#999;line-height:26px">この期間のデータなし</span></div>`;
  }else{
    bar = `<div class="ratio-bar">
      <span class="seg-store" style="width:${sp}%">${sp>=12?sp+'%':''}</span>
      <span class="seg-net" style="width:${np}%">${np>=12?np+'%':''}</span>
    </div>`;
  }

  return `<div class="card">
    <div class="sec-ttl">店舗 : ネット 仕入れ比率</div>
    <div class="period-row">${chips}</div>
    ${bar}
    <div class="ratio-legend">
      <span><span class="dot" style="background:var(--accent)"></span>店舗 ${s.store.count}点 / ${yen(s.store.amt)}</span>
      <span><span class="dot" style="background:#94A3B8"></span>ネット ${s.net.count}点 / ${yen(s.net.amt)}</span>
    </div>
  </div>`;
}

function renderControls(){
  const sorts = [
    ['lastAsc','最終仕入が古い順'],
    ['itemDesc','仕入れ点数が多い順'],
    ['nameAsc','店舗名順']
  ];
  const sortBtns = sorts.map(([k,l])=>`<span class="chip${state.sort===k?' active':''}" onclick="setSort('${k}')">${l}</span>`).join('');
  return `<div class="card">
    <p class="ctrl-label">並び順</p>
    <div class="sort-row">${sortBtns}</div>
    <label class="toggle-row">
      <input type="checkbox" ${state.excludeOnce?'checked':''} onchange="toggleOnce(this.checked)">
      1回来店のみの店舗を除外する
    </label>
    <input id="search" type="text" placeholder="店舗名で検索…" oninput="setSearch(this.value)">
  </div>`;
}

function renderList(){
  const th = getSettings().threshold;
  let stores = aggregateStores().filter(s=>!s.online); // 実店舗のみ
  if(state.excludeOnce) stores = stores.filter(s=>s.visitCount>1);
  if(state.search.trim()){
    const q = state.search.trim().toLowerCase();
    stores = stores.filter(s=>s.name.toLowerCase().includes(q));
  }
  // 並び替え
  stores.sort((a,b)=>{
    if(state.sort==='itemDesc') return b.itemCount - a.itemCount;
    if(state.sort==='nameAsc') return a.name.localeCompare(b.name,'ja');
    // lastAsc: 古い順。日付不明は末尾へ
    if(a.lastDate && b.lastDate) return a.lastDate.localeCompare(b.lastDate);
    if(a.lastDate && !b.lastDate) return -1;
    if(!a.lastDate && b.lastDate) return 1;
    return a.name.localeCompare(b.name,'ja');
  });

  if(stores.length===0){
    return `<div class="card"><div class="empty">該当する店舗がありません。</div></div>`;
  }

  const rows = stores.map(s=>{
    const stale = (s.days!==null && s.days > th);
    const mapUrl = 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name);
    let badges = '';
    if(stale) badges += `<span class="badge stale">しばらく未訪問</span>`;
    if(s.visitCount===1) badges += `<span class="badge once">1回のみ</span>`;
    const approx = s.lastInferred ? '約' : '';
    const infMark = s.lastInferred ? `<span class="badge infer" title="仕入日に年が無いため推定">推定</span>` : '';
    const lastLine = s.lastDate
      ? `最終仕入: ${s.lastDate}${infMark}（<span class="days${stale?' warn':''}">${approx}${s.days}日前</span>）`
      : `最終仕入: <span style="color:#999">日付未記録</span>`;
    return `<div class="store${stale?' stale':''}">
      <div class="store-top">
        <div class="store-name">${esc(s.name)}${badges}</div>
        <a class="map-btn" href="${mapUrl}" target="_blank" rel="noopener">🗺️ マップ</a>
      </div>
      <div class="store-last">${lastLine}</div>
      <div class="store-stats"><b>${s.itemCount}</b>点仕入れ ・ <b>${s.visitCount}</b>回来店 ・ 仕入総額 <b>${yen(s.totalSpent)}</b></div>
    </div>`;
  }).join('');

  return `<div class="card">
    <div class="sec-ttl">実店舗リスト</div>
    <div class="list-meta">${stores.length}店舗</div>
    ${rows}
  </div>`;
}

function renderSettingsUI(){
  const s = getSettings();
  const kws = s.onlineKeywords.map((kw,i)=>`<span class="kw">${esc(kw)}<button onclick="removeKw(${i})" title="削除">✕</button></span>`).join('');
  return `<div class="card">
    <details class="settings">
      <summary>設定</summary>
      <div class="set-block">
        <p class="ctrl-label">ネット仕入れと判定するキーワード（店舗名にこの語を含むとネット扱い＝リストに出さない）</p>
        <div class="kw-list">${kws||'<span style="font-size:12px;color:#999">（なし）</span>'}</div>
        <div class="kw-add">
          <input id="kw-input" type="text" placeholder="例：メルカリ" onkeydown="if(event.key==='Enter')addKw()">
          <button onclick="addKw()">追加</button>
        </div>
      </div>
      <div class="set-block">
        <p class="ctrl-label">「しばらく未訪問」と判定する日数</p>
        <div class="num-row">
          <input id="th-input" type="number" min="1" value="${s.threshold}">
          <span style="font-size:13px;color:#555">日以上で強調</span>
          <button onclick="saveThreshold()">保存</button>
        </div>
      </div>
    </details>
  </div>`;
}

// ==================== イベント ====================
function setPeriod(p){ state.period=p; render(); }
function setSort(k){ state.sort=k; render(); }
function toggleOnce(v){ state.excludeOnce=v; render(); }
function setSearch(v){
  state.search=v;
  // 検索はリストだけ再描画したいが、シンプルにフルレンダー。フォーカスとカーソルを維持
  const root=document.getElementById('root');
  const listCard = root.querySelectorAll('.card')[2];
  // フルレンダーするとIME中に都合が悪いので、リスト部分のみ差し替え
  if(listCard){
    const tmp=document.createElement('div');
    tmp.innerHTML=renderList();
    listCard.replaceWith(tmp.firstElementChild);
  }else{
    render();
  }
}
function addKw(){
  const inp=document.getElementById('kw-input');
  const v=(inp.value||'').trim();
  if(!v) return;
  const s=getSettings();
  if(!s.onlineKeywords.includes(v)) s.onlineKeywords.push(v);
  saveSettings(s);
  render();
  setTimeout(()=>{ const d=document.querySelector('details.settings'); if(d) d.open=true; },0);
}
function removeKw(i){
  const s=getSettings();
  s.onlineKeywords.splice(i,1);
  saveSettings(s);
  render();
  setTimeout(()=>{ const d=document.querySelector('details.settings'); if(d) d.open=true; },0);
}
function saveThreshold(){
  const v=parseInt(document.getElementById('th-input').value,10);
  const s=getSettings();
  s.threshold = (Number.isFinite(v)&&v>0)?v:DEFAULT_THRESHOLD;
  saveSettings(s);
  render();
  setTimeout(()=>{ const d=document.querySelector('details.settings'); if(d) d.open=true; },0);
}

// ==================== データ読み込み ====================
function loadData(){
  _loaded=false; _loadError=''; render();
  _db.collection('inventory').get()
    .then(snap=>{
      const arr=[];
      snap.forEach(doc=>{
        const d=doc.data()||{};
        const nd = normalizeDate(d.purchaseDate||'');
        arr.push({
          purchaseSource: d.purchaseSource||'',
          purchaseDate: d.purchaseDate||'',
          purchasePrice: Number(d.purchasePrice)||0,
          _iso: nd.iso,
          _inferred: nd.inferred
        });
      });
      _items=arr; _loaded=true; render();
    })
    .catch(err=>{
      _loaded=false; _loadError=(err&&err.message)||String(err); render();
    });
}
function reload(){ if(_db) loadData(); }

// ==================== 起動 ====================
try{
  if(!firebase.apps.length) firebase.initializeApp(FB_CFG);
  _db = firebase.firestore();
  loadData();
}catch(e){
  _loaded=false; _loadError=(e&&e.message)||String(e); render();
}
</script>
</body>
</html>
